# Why the btrfs-progs v5.11 headers and not the newest release?
#   compsize includes the btrfs userspace headers <btrfs/ioctl.h> and <btrfs/ctree.h>.
#   btrfs-progs v5.11 defines libbtrfs_headers (including ioctl.h and kernel-shared/ctree.h) and its
#   `make install` copies that set **flat** into $(incdir)/btrfs/; this project reproduces the layout.
#   Later releases move the headers into libbtrfs/ and trim them; compsize no longer compiles against
#   them (missing gfp_t / errno / ENOTTY definitions), so the pin is kept at the last version whose
#   header layout compsize supports.  Bumping it requires patching compsize.
#   Note: the device-side btrfs-progs version does not affect compsize at run time - it issues the
#   ioctl directly and links no library - so this pin is purely about what compsize can be built with.
